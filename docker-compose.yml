services:
  postgres:
    image: postgres:15-alpine
    container_name: eldercare-postgres
    environment:
      POSTGRES_USER: care
      POSTGRES_PASSWORD: care123
      POSTGRES_DB: eldercare
      TZ: Asia/Shanghai
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U care -d eldercare"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: eldercare-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    container_name: eldercare-backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ELDERCARE_DB_URL: jdbc:postgresql://postgres:5432/eldercare
      ELDERCARE_DB_USER: care
      ELDERCARE_DB_PASSWORD: care123
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      TZ: Asia/Shanghai
    ports:
      - "8080:8080"
    volumes:
      - uploads:/app/uploads

  frontend:
    build: ./frontend
    container_name: eldercare-frontend
    depends_on:
      - backend
    ports:
      - "8081:80"

volumes:
  pgdata:
  redisdata:
  uploads:
